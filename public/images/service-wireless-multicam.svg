<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <rect width="800" height="600" fill="#0B1120"/>
  <!-- Signal Waves -->
  <circle cx="400" cy="280" r="210" stroke="#0284C7" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="400" cy="280" r="150" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- Central Switching Receiver -->
  <rect x="290" y="210" width="220" height="140" rx="12" fill="#0F172A" stroke="#0284C7" stroke-width="3"/>
  <text x="326" y="255" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="700">MULTICAM HUB</text>
  <text x="330" y="282" fill="#38BDF8" font-family="monospace" font-size="13">4x WIRELESS SDI</text>
  <rect x="325" y="302" width="150" height="24" rx="4" fill="#1E293B"/>
  <text x="342" y="319" fill="#10B981" font-family="monospace" font-size="12">LOW-LATENCY SYNC</text>
  <!-- 4 Satellite Camera Nodes -->
  <g fill="#1E293B" stroke="#38BDF8" stroke-width="2">
    <rect x="80" y="80" width="130" height="80" rx="8"/>
    <rect x="590" y="80" width="130" height="80" rx="8"/>
    <rect x="80" y="420" width="130" height="80" rx="8"/>
    <rect x="590" y="420" width="130" height="80" rx="8"/>
  </g>
  <text x="108" y="125" fill="#E2E8F0" font-family="monospace" font-size="14" font-weight="700">CAM 01 · A</text>
  <text x="618" y="125" fill="#E2E8F0" font-family="monospace" font-size="14" font-weight="700">CAM 02 · B</text>
  <text x="108" y="465" fill="#E2E8F0" font-family="monospace" font-size="14" font-weight="700">CAM 03 · C</text>
  <text x="618" y="465" fill="#E2E8F0" font-family="monospace" font-size="14" font-weight="700">CAM 04 · D</text>
  <line x1="210" y1="140" x2="290" y2="220" stroke="#38BDF8" stroke-width="2.5"/>
  <line x1="590" y1="140" x2="510" y2="220" stroke="#38BDF8" stroke-width="2.5"/>
  <line x1="210" y1="440" x2="290" y2="340" stroke="#38BDF8" stroke-width="2.5"/>
  <line x1="590" y1="440" x2="510" y2="340" stroke="#38BDF8" stroke-width="2.5"/>
</svg>
