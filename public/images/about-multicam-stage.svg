<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" fill="none">
  <defs>
    <linearGradient id="studioBg" x1="0" y1="0" x2="1200" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="lensGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#studioBg)"/>

  <!-- Background Stage Lighting Trusses -->
  <line x1="0" y1="120" x2="1200" y2="120" stroke="#334155" stroke-width="6"/>
  <line x1="0" y1="145" x2="1200" y2="145" stroke="#334155" stroke-width="3"/>
  <circle cx="240" cy="155" r="24" fill="#38BDF8" opacity="0.35"/>
  <circle cx="600" cy="155" r="24" fill="#0284C7" opacity="0.4"/>
  <circle cx="960" cy="155" r="24" fill="#38BDF8" opacity="0.35"/>

  <!-- Broadcast Cinema Camera Body & Rig -->
  <g transform="translate(180, 250)">
    <!-- On-Camera Field Monitor -->
    <rect x="210" y="-110" width="230" height="135" rx="8" fill="#090D16" stroke="#475569" stroke-width="3"/>
    <rect x="222" y="-98" width="206" height="111" rx="4" fill="#0F172A"/>
    <path d="M250 -10 L325 -70 L400 -10 Z" fill="#0284C7" opacity="0.45"/>
    <text x="234" y="-76" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="700">SDI TX1 · 1080p60</text>
    <text x="234" y="-18" fill="#E2E8F0" font-family="monospace" font-size="12">WIRELESS LINK OK</text>
    <!-- Monitor Mount Arm -->
    <rect x="315" y="25" width="20" height="35" fill="#475569"/>

    <!-- Top Handle & Wireless Video Transmitter -->
    <path d="M180 60 L440 60 L440 90 L180 90 Z" fill="#334155"/>
    <rect x="110" y="10" width="75" height="115" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <line x1="130" y1="10" x2="130" y2="-55" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
    <line x1="165" y1="10" x2="165" y2="-55" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="130" cy="-58" r="5" fill="#38BDF8"/>
    <circle cx="165" cy="-58" r="5" fill="#38BDF8"/>

    <!-- Main Camera Body -->
    <rect x="160" y="90" width="340" height="210" rx="14" fill="#090D16" stroke="#475569" stroke-width="3"/>
    <rect x="190" y="120" width="160" height="90" rx="6" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="208" y="152" fill="#38BDF8" font-family="monospace" font-size="16" font-weight="700">CAM-A MASTER</text>
    <text x="208" y="178" fill="#94A3B8" font-family="monospace" font-size="14">24.000 dB / 5600K</text>
    <text x="208" y="198" fill="#10B981" font-family="monospace" font-size="13">GENLOCK SYNCED</text>

    <!-- V-Mount Battery Unit -->
    <rect x="85" y="115" width="75" height="165" rx="8" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <rect x="102" y="140" width="40" height="10" rx="2" fill="#10B981"/>
    <rect x="102" y="156" width="40" height="10" rx="2" fill="#10B981"/>
    <rect x="102" y="172" width="40" height="10" rx="2" fill="#10B981"/>
    <rect x="102" y="188" width="40" height="10" rx="2" fill="#38BDF8"/>

    <!-- Broadcast Zoom Lens & Matte Box -->
    <rect x="500" y="115" width="160" height="160" rx="6" fill="#1E293B" stroke="#475569" stroke-width="2.5"/>
    <line x1="540" y1="115" x2="540" y2="275" stroke="#0284C7" stroke-width="4"/>
    <line x1="600" y1="115" x2="600" y2="275" stroke="#334155" stroke-width="6"/>
    <!-- Matte Box Hood -->
    <path d="M660 105 L780 65 L780 325 L660 285 Z" fill="#090D16" stroke="#475569" stroke-width="3"/>
    <ellipse cx="755" cy="195" rx="22" ry="95" fill="url(#lensGlass)"/>

    <!-- Fluid Head Tripod -->
    <rect x="240" y="300" width="180" height="36" rx="6" fill="#334155"/>
    <path d="M275 336 L385 336 L415 430 L245 430 Z" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <!-- Pan Bar -->
    <line x1="260" y1="365" x2="90" y2="455" stroke="#64748B" stroke-width="12" stroke-linecap="round"/>
    <!-- Tripod Legs -->
    <line x1="270" y1="430" x2="180" y2="650" stroke="#334155" stroke-width="18"/>
    <line x1="330" y1="430" x2="330" y2="650" stroke="#475569" stroke-width="18"/>
    <line x1="390" y1="430" x2="480" y2="650" stroke="#334155" stroke-width="18"/>
  </g>
</svg>
